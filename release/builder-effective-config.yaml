directories:
  output: release
  buildResources: build
appId: com.fableharbinger.fablecode
productName: FableCode
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
files:
  - filter:
      - dist/**/*
      - package.json
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - arm64
dmg:
  contents:
    - x: 130
      'y': 220
    - x: 410
      'y': 220
      type: link
      path: /Applications
electronVersion: 42.0.0
